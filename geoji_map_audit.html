<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乞丐地圖 - 韓系極簡版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet.js 地圖 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100%; width: 100%; z-index: 10; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-900 flex justify-center items-center h-screen m-0 overflow-hidden font-sans">

    <!-- 手機外框容器 (擬真 App 體驗) -->
    <div class="w-full max-w-md h-full sm:h-[840px] sm:rounded-[40px] sm:ring-8 sm:ring-zinc-800 bg-white flex flex-col relative overflow-hidden shadow-2xl">
        
        <!-- 頂部搜尋與過濾列 -->
        <div class="bg-white/90 backdrop-blur-md px-4 py-3.5 border-b border-zinc-100 flex items-center space-x-2 z-20">
            <div class="flex-1 bg-zinc-100 flex items-center px-3.5 py-2.5 rounded-2xl space-x-2">
                <i class="fa-solid fa-magnifying-glass text-zinc-400 text-xs"></i>
                <input type="text" id="search-input" placeholder="搜尋附近平價美食、即期品..." class="bg-transparent text-xs w-full focus:outline-none text-zinc-800" oninput="filterMarkers()">
            </div>
            <button onclick="openReportModal()" class="bg-zinc-900 text-white px-4 py-2.5 rounded-2xl text-xs font-bold flex items-center space-x-1 shadow-md hover:bg-zinc-800 transition">
                <i class="fa-solid fa-plus text-[10px]"></i>
                <span>回報</span>
            </button>
        </div>

        <!-- 地圖互動主畫面 -->
        <div class="flex-1 relative">
            <div id="map"></div>
        </div>

        <!-- 地點詳細卡片 -->
        <div id="location-card" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] shadow-[0_-10px_30px_rgba(0,0,0,0.1)] p-6 z-30 transform translate-y-full transition-transform duration-300">
            <div class="w-10 h-1 bg-zinc-200 rounded-full mx-auto mb-4"></div>
            
            <div class="flex justify-between items-start mb-2">
                <div>
                    <span id="card-badge" class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full">社群精選</span>
                    <h3 id="card-title" class="font-black text-lg mt-1.5 text-zinc-900">地點名稱</h3>
                </div>
                <button onclick="closeCard()" class="text-zinc-400 hover:text-zinc-900 w-8 h-8 flex items-center justify-center rounded-full bg-zinc-100"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            
            <p id="card-desc" class="text-xs text-zinc-500 mb-4 leading-relaxed">地點詳細說明...</p>
            
            <!-- 狀態與審核區 -->
            <div class="bg-zinc-50 p-3.5 rounded-2xl border border-zinc-100 mb-4 space-y-2.5">
                <div class="flex items-center justify-between text-[11px]">
                    <div class="flex items-center space-x-1.5 text-emerald-600">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span id="card-status" class="font-bold text-zinc-700">社群共識度：95% 正常</span>
                    </div>
                    <span id="card-reports" class="text-rose-500 font-bold">已被回報失效：0 次</span>
                </div>
                
                <!-- 投票與回報失效按鈕列 -->
                <div class="flex items-center space-x-2 pt-2 border-t border-zinc-200/50">
                    <button onclick="voteTrust(1)" class="flex-1 bg-white border border-zinc-200 py-2 rounded-xl text-xs font-bold hover:bg-emerald-50 hover:border-emerald-200 text-emerald-600 flex items-center justify-center space-x-1 transition">
                        <i class="fa-solid fa-thumbs-up"></i> <span>有效 (<span id="trust-count">24</span>)</span>
                    </button>
                    <button onclick="voteTrust(-1)" class="flex-1 bg-white border border-zinc-200 py-2 rounded-xl text-xs font-bold hover:bg-rose-50 hover:border-rose-200 text-rose-500 flex items-center justify-center space-x-1 transition">
                        <i class="fa-solid fa-thumbs-down"></i> <span>不實</span>
                    </button>
                    <!-- 回報失效按鈕 -->
                    <button onclick="reportInvalid()" class="bg-amber-50 border border-amber-200 px-3.5 py-2 rounded-xl text-xs font-bold text-amber-700 hover:bg-amber-100 flex items-center space-x-1 transition">
                        <i class="fa-solid fa-triangle-exclamation"></i> <span>失效</span>
                    </button>
                </div>
            </div>

            <button class="w-full bg-zinc-900 text-white py-3 rounded-2xl text-xs font-bold shadow-lg hover:bg-zinc-800 transition">
                導航前往此地點
            </button>
        </div>

        <!-- 回報新地點彈窗 -->
        <div id="report-modal" class="absolute inset-0 bg-zinc-950/60 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-sm rounded-[32px] p-6 shadow-2xl space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-black text-base text-zinc-900">回報省錢新據點</h3>
                    <button onclick="closeReportModal()" class="text-zinc-400 hover:text-zinc-900"><i class="fa-solid fa-xmark text-base"></i></button>
                </div>
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="font-bold text-zinc-700 block mb-1">地點名稱</label>
                        <input type="text" id="report-name" placeholder="例如：某某超商 7折即期品" class="w-full bg-zinc-100 p-3 rounded-2xl border-none focus:outline-none text-zinc-800">
                    </div>
                    <div>
                        <label class="font-bold text-zinc-700 block mb-1">詳細說明與注意事項</label>
                        <textarea id="report-desc" placeholder="請填寫具體位置、價格或優惠時段..." class="w-full bg-zinc-100 p-3 rounded-2xl border-none focus:outline-none h-24 text-zinc-800 resize-none"></textarea>
                    </div>
                    <div class="bg-amber-50 border border-amber-200 p-3 rounded-2xl text-amber-900 text-[11px] leading-relaxed">
                        <i class="fa-solid fa-circle-info mr-1 text-amber-600"></i>
                        <b>社群守則：</b>若經多位使用者點擊「失效」，該地圖標記將自動下架！
                    </div>
                </div>
                <button onclick="submitReport()" class="w-full bg-amber-400 text-zinc-950 font-black py-3 rounded-2xl shadow-md hover:bg-amber-300 transition text-xs">
                    確認送出回報
                </button>
            </div>
        </div>

    </div>

    <!-- Leaflet.js 地圖 JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map', {zoomControl: false}).setView([22.6398, 120.3026], 15);

        // 使用標準開源地圖，確保台灣在地圖上精準清晰
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markersData = [
            { id: 1, lat: 22.6410, lng: 120.3010, title: "高醫附近 60元佛心炒飯", desc: "份量超大，學生憑證再折 5元。", trust: 42, invalidCount: 0, status: "正常" },
            { id: 2, lat: 22.6380, lng: 120.3050, title: "全家超商 - 即期便當 7折區", desc: "每天晚上 8 點後品項最多。", trust: 18, invalidCount: 1, status: "注意：品項消耗中" },
            { id: 3, lat: 22.6355, lng: 120.2980, title: "高雄火車站 - 免費飮水與充電", desc: "大廳提供友善座談區與免費插座。", trust: 56, invalidCount: 0, status: "正常運作" },
            { id: 4, lat: 22.6440, lng: 120.3075, title: "十全路 50元大份量肉燥飯", desc: "附贈免費柴魚湯，月底省錢好去處。", trust: 31, invalidCount: 0, status: "正常" }
        ];

        let currentMarkers = [];
        let activeItem = null;

        function renderMarkers(keyword = '') {
            currentMarkers.forEach(m => map.removeLayer(m));
            currentMarkers = [];

            markersData.forEach(item => {
                if (item.invalidCount >= 3) return;
                if (keyword && !item.title.includes(keyword) && !item.desc.includes(keyword)) return;

                let markerIcon = L.divIcon({
                    className: 'custom-pin',
                    html: `<div class="bg-zinc-900 text-white text-[11px] px-3 py-1.5 rounded-full shadow-xl border border-amber-400 font-bold flex items-center space-x-1.5 whitespace-nowrap">
                             <span class="text-amber-400">🔥</span>
                             <span>${item.title}</span>
                           </div>`,
                    iconSize: [null, 32]
                });

                let marker = L.marker([item.lat, item.lng], {icon: markerIcon}).addTo(map);
                marker.on('click', () => showLocationCard(item));
                currentMarkers.push(marker);
            });
        }

        renderMarkers();

        function filterMarkers() {
            let keyword = document.getElementById('search-input').value;
            renderMarkers(keyword);
        }

        function showLocationCard(item) {
            activeItem = item;
            document.getElementById('card-title').innerText = item.title;
            document.getElementById('card-desc').innerText = item.desc;
            document.getElementById('trust-count').innerText = item.trust;
            document.getElementById('card-reports').innerText = `已被回報失效：${item.invalidCount} 次`;
            document.getElementById('card-status').innerText = `社群共識度：${item.trust > 30 ? '95%' : '80%'} 正常`;
            
            document.getElementById('location-card').classList.remove('translate-y-full');
        }

        function closeCard() {
            document.getElementById('location-card').classList.add('translate-y-full');
        }

        function voteTrust(val) {
            if (!activeItem) return;
            activeItem.trust += val;
            document.getElementById('trust-count').innerText = activeItem.trust;
            alert('感謝您的回饋！這有助於提升社群共識。');
        }

5.  function reportInvalid() {
            if (!activeItem) return;
            activeItem.invalidCount += 1;
            document.getElementById('card-reports').innerText = `已被回報失效：${activeItem.invalidCount} 次`;
            
            if (activeItem.invalidCount >= 3) {
                alert('此地點已被多位使用者回報失效，系統已自動將其下架！');
                closeCard();
                renderMarkers();
            } else {
                alert(`已送出失效回報（目前累積 ${activeItem.invalidCount}/3 次）。`);
            }
        }

        function openReportModal() { document.getElementById('report-modal').classList.remove('hidden'); }
        function closeReportModal() { document.getElementById('report-modal').classList.add('hidden'); }
        
        function submitReport() {
            let name = document.getElementById('report-name').value;
            let desc = document.getElementById('report-desc').value;
            if(!name) { alert('請輸入地點名稱！'); return; }

            let center = map.getCenter();
            let newLat = center.lat + (Math.random() - 0.5) * 0.005;
            let newLng = center.lng + (Math.random() - 0.5) * 0.005;

            let newItem = {
                id: markersData.length + 1,
                lat: newLat,
                lng: newLng,
                title: name,
                desc: desc || "無詳細說明",
                trust: 1,
                invalidCount: 0,
                status: "新回報（審核中）"
            };

            markersData.push(newItem);
            renderMarkers();

            alert('回報成功！新據點已即時新增至地圖上。');
            closeReportModal();
            document.getElementById('report-name').value = '';
            document.getElementById('report-desc').value = '';
        }
    </script>
</body>
</html>
